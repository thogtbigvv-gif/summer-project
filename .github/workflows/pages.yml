name: Deploy to GitHub Pages

on:
  # data/** дээр paths-ignore ТАВИХГҮЙ гэж СОНГОВ.
  #
  # github-evidence.yml өдөр бүр data/github.json-ыг commit хийдэг тул тэр
  # түлхэлт бүр энэ deploy-г ажиллуулна. Өдөрт нэг удаагийн нэмэлт deploy бол
  # статик модны хувьд хэдхэн секунд. Түүнийг алгасвал файл repo дотор шинэ,
  # харин АМЬД САЙТАД хуучин хэвээр үлдэж, дараагийн кодын өөрчлөлт хүртэл
  # хоцордог — CREATION хэдэн өдрөөр хойшилж, эвдэрсэн мэт харагдана.
  # Тэр файлын БҮХ УТГА нь амьд сайтад уншигдах явдал учраас хурднаас нь
  # шинэлэг байдлыг нь сонгов.
  #
  # (Файл ҮНЭХЭЭР өөрчлөгдсөн үед л commit үүсдэг — github-evidence.yml
  #  агуулгыг нь харьцуулдаг тул өдөр тутмын ХООСОН commit гарахгүй.)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Зэрэг ажиллах deploy-г хориглоно, гэхдээ явж буйг нь тасалдуулахгүй.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Build step шаардлагагүй — vanilla HTML/CSS/JS-г шууд upload хийнэ.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 минут — action-ы өөрийнх нь 10 минутын default-ын оронд. Тэр
          # default-ыг Pages-ийн тохиргооны UI-гаас өөрчлөх аргагүй, зөвхөн
          # эндээс л удирдана. 2026-08-06-нд GitHub-ийн Pages-ийн deploy
          # дараалал гацсан: хөрш Bigu repo дээр build 20 секундэд амжилттай
          # дуусаад, deploy нь `deployment_queued` төлөвт сууж байгаад action
          # бууж өгсөн — хоёр өөр commit дээр хоёр удаа, эрүүл үедээ ердөө 6
          # секунд болдог газар. Сайтад ямар ч эвдрэл байгаагүй; run улаан
          # болоод юу ч нийтлэгдээгүй. Энд ч deploy секундээр хэмжигдэнэ,
          # тэгэхээр энэ хугацаа нь хурдны төлөө биш: дараалал бөглөрөхөд
          # "унасан deploy" биш "удаан deploy" болгохын тулд байгаа юм.
          # Хэрэгтэй бол нэмнэ, багасгаж default руу нь "цэвэрлэхгүй".
          timeout: 1800000
          # Төлөвөө 5 секунд тутам биш, 15 секунд тутам асууна. 30 минутын
          # дээд хязгаартай үед default нь ганц үр дүн хэлэхийн тулд 360
          # status request явуулна.
          reporting_interval: 15000
