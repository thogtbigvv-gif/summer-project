<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Omega">
  <!-- Профайлын Ω-тэй ижил тэмдэг. Үсэг биш, зам (path) — icon-ыг ямар ч
       систем дээр рендер хийхэд фонт байхгүйгээс хоосон дөрвөлжин болохгүй.

       ХӨЛ НЬ НУМТАЙГАА НЭГ ЗАМ. Урьд нь гурван тусдаа зураас байсан: нум,
       зүүн хөл, баруун хөл. Хөлүүд нь нумын үзүүрээс 26px доор эхэлдэг тул
       холбогдохгүй, өөрөө хөвж, уулзварт нь шат үүсгэдэг байв — жижиг
       хэмжээнд рендерийн алдаа мэт харагдана. Одоо нэг тасралтгүй зам:
       нумаас бууж, хурцаар эргэж, хавтгай хөл болж төгсөнө.

       Байрлал нь ТООЦООЛСОН: тэмдэг 512-ийн 62.7% өргөнтэй, дөрвөн талдаа
       яг тэнцүү зайтай (дээш/доош 113, зүүн/баруун 95.4). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="8"/>
  <path fill="none" stroke="#10b981" stroke-width="48.4" stroke-linecap="round" stroke-linejoin="round"
        d="M119.6 374.83 H170.2 C 187.8 374.83 192.2 366.03 191.1 350.63 A 116.6 116.6 0 1 1 320.9 350.63 C 319.8 366.03 324.2 374.83 341.8 374.83 H392.4"/>
</svg>
